<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLASH FOOTBALLWEEN · Castell de Xàtiva → IES Dr. Lluís Simarro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #05060a;
      --neon-orange: #ff5e00;
      --neon-purple: #9333ea;
      --neon-green: #22c55e;
      --gold: #eab308;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Space Grotesk', sans-serif;
      overflow-x: hidden;
      scroll-behavior: smooth;
      user-select: none;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #05060a; }
    ::-webkit-scrollbar-thumb { background: var(--neon-orange); border-radius: 4px; }

    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      cursor: grab;
    }
    #webgl-canvas:active { cursor: grabbing; }

    .vignette-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(circle at 50% 50%, transparent 45%, rgba(4, 5, 9, 0.88) 100%);
      box-shadow: inset 0 0 120px rgba(0,0,0,0.92);
    }

    .fnav{position:fixed;top:14px;left:50%;z-index:60;width:min(1080px,calc(100% - 24px));transform:translate(-50%,0);transition:transform .35s ease,opacity .35s;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 12px 9px 14px;background:rgba(10,12,20,.85);backdrop-filter:blur(18px);border:1px solid rgba(255,94,0,.35);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 24px rgba(255,94,0,.12)}
    .fnav.hide{transform:translate(-50%,-140%);opacity:0;pointer-events:none}
    .brand { display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--text-main); }
    .brand-crest {
      width: 36px; height: 36px; background: #0f131d; border: 1.5px solid var(--neon-orange);
      display: flex; align-items: center; justify-content: center; box-shadow: 0 0 18px rgba(255, 94, 0, 0.4);
      clip-path: polygon(15% 0%, 85% 0%, 100% 15%, 100% 85%, 50% 100%, 0% 85%, 0% 15%);
    }
    .brand-crest span { font-family: 'Cinzel', serif; font-weight: 900; color: var(--neon-orange); font-size: 15px; }
    .brand-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.22em; color: var(--neon-orange); text-transform: uppercase; display: block; }
    .brand-title { font-family: 'Cinzel', serif; font-weight: 900; font-size: 15px; letter-spacing: 0.05em; color: #fff; white-space: nowrap; }

    .fnav-links{display:flex;gap:4px;list-style:none}
    .fnav-links button{background:none;border:0;color:var(--text-muted);font:700 12px 'Space Grotesk',sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:9px 13px;border-radius:10px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:7px}
    .fnav-links button:hover{color:#fff;background:rgba(255,94,0,.16)}
    .live-dot{width:7px;height:7px;background:var(--neon-green);border-radius:50%;box-shadow:0 0 8px var(--neon-green);animation:pulse 1.5s infinite}
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.35); opacity: 0.5; } }

    .btn-primary-neon {
      background: var(--neon-orange); color: #05060a; border: none; padding: 10px 18px;
      font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 12px;
      text-transform: uppercase; letter-spacing: 0.08em; cursor: pointer;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
      transition: transform 0.15s, box-shadow 0.2s; white-space: nowrap;
    }
    .btn-primary-neon:hover { transform: translateY(-2px); box-shadow: 0 0 22px rgba(255, 94, 0, 0.75); background: #ff7426; }

    .altitude-hud {
      position: fixed; left: 24px; top: 50%; transform: translateY(-50%); z-index: 40;
      display: flex; flex-direction: column; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; pointer-events: none;
    }
    .alt-label { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10px; letter-spacing: 0.2em; color: var(--text-muted); }
    .alt-bar-track { width: 4px; height: 200px; background: rgba(255, 255, 255, 0.12); position: relative; border-radius: 2px; }
    .alt-bar-fill { position: absolute; top: 0; left: 0; width: 100%; height: 0%; background: var(--neon-orange); box-shadow: 0 0 12px var(--neon-orange); }
    .alt-value { font-size: 12px; color: var(--neon-orange); font-weight: 700; }

    .scroll-hint {
      position: fixed; bottom: 24px; right: 32px; z-index: 40; display: flex; align-items: center; gap: 10px;
      font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted);
      background: rgba(5, 6, 10, 0.88); padding: 9px 14px; border: 1px solid rgba(255, 94, 0, 0.15); pointer-events: none;
    }
    .scroll-mouse { width: 15px; height: 22px; border: 1.5px solid var(--neon-orange); border-radius: 9px; position: relative; }
    .scroll-wheel { width: 3px; height: 5px; background: var(--neon-orange); position: absolute; top: 4px; left: 50%; transform: translateX(-50%); animation: wheelMove 1.4s infinite; }
    @keyframes wheelMove { 0% { top: 4px; opacity: 1; } 100% { top: 13px; opacity: 0; } }

    .hs{position:fixed;left:0;top:0;z-index:30;display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s}
    .hs i{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:24px;background:radial-gradient(circle,#2a1206,#0b0d13);border:2px solid var(--neon-orange);box-shadow:0 0 22px rgba(255,94,0,.75);animation:hsp 1.8s infinite}
    .hs span{font:700 10px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:rgba(5,6,10,.85);border:1px solid rgba(255,94,0,.45);padding:3px 8px;white-space:nowrap}
    @keyframes hsp{0%,100%{box-shadow:0 0 14px rgba(255,94,0,.6)}50%{box-shadow:0 0 34px rgba(255,94,0,1),0 0 0 9px rgba(255,94,0,.12)}}

    .modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(3,4,8,.75);backdrop-filter:blur(6px)}
    .modal.open{display:flex}
    .mcard{position:relative;width:min(640px,100%);max-height:84vh;overflow:auto;padding:34px 30px 28px;background:linear-gradient(160deg,rgba(26,12,6,.97),rgba(12,8,22,.97));border:1px solid var(--neon-orange);border-radius:18px;box-shadow:0 0 50px rgba(255,94,0,.35),0 0 90px rgba(147,51,234,.2)}
    .mx{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,94,0,.6);background:#150a05;color:var(--neon-orange);font-size:16px;cursor:pointer;z-index:2}
    .mx:hover{background:var(--neon-orange);color:#05060a}
    .mcard h2{font-family:'Cinzel',serif;font-size:24px;text-transform:uppercase;margin:8px 0 12px;color:#fff}
    .mcard h2 em{color:var(--neon-orange);font-style:normal}
    .mcard p,.mcard li{font-size:14px;line-height:1.65;color:#cbd5e1}
    .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
    .mgrid div{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);padding:10px;font-size:13px;color:#cbd5e1}
    .mgrid strong{display:block;font:700 14px 'JetBrains Mono',monospace;color:var(--neon-orange);margin-bottom:2px}
    .tabs{display:flex;gap:6px;margin:6px 0 14px}
    .tabs button{flex:1;padding:9px;background:#0b0d13;border:1px solid rgba(255,255,255,.15);color:var(--text-muted);font:700 12px 'Space Grotesk';text-transform:uppercase;cursor:pointer}
    .tabs button.on{border-color:var(--neon-orange);color:#fff;background:rgba(255,94,0,.15)}
    .mcard form{display:grid;gap:9px}
    .mcard input,.mcard select{width:100%;padding:10px 12px;background:#080a10;border:1px solid rgba(255,255,255,.18);color:#fff;font:14px 'Space Grotesk';border-radius:6px}
    .mcard input:focus,.mcard select:focus{outline:none;border-color:var(--neon-orange)}
    .vid{aspect-ratio:16/9;display:grid;place-items:center;text-align:center;background:#06070c;border:1px dashed rgba(34,197,94,.5);color:#4ade80;font:12px 'JetBrains Mono';padding:12px}
    .st{display:inline-block;padding:2px 9px;font:700 10px 'JetBrains Mono';margin-right:6px}
    .st.p{background:#333;color:#aaa}.st.l{background:rgba(34,197,94,.2);color:#4ade80}.st.f{background:rgba(234,179,8,.2);color:#facc15}
  </style>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>
  <div class="vignette-overlay"></div>

  <nav class="fnav" id="fnav">
    <a href="#" class="brand" onclick="window.scrollTo({top:0,behavior:'smooth'});return false">
      <div class="brand-crest"><span>CF</span></div>
      <div><span class="brand-sub">XÀTIVA 2026</span><span class="brand-title">CLASH FOOTBALLWEEN</span></div>
    </a>
    <ul class="fnav-links">
      <li><button onclick="window.scrollTo({top:0,behavior:'smooth'})">Inicio</button></li>
      <li><button onclick="openModal('bracket')">Clasificación</button></li>
      <li><button onclick="openModal('jugadores')">Jugadores</button></li>
      <li><button onclick="openModal('directo')"><span class="live-dot"></span>Directo</button></li>
    </ul>
    <button class="btn-primary-neon" id="nav-auth" onclick="openModal('auth')">Registro / Inicio</button>
  </nav>

  <div id="hs-layer"></div>

  <div class="modal" id="modal">
    <div class="mcard" role="dialog" aria-modal="true">
      <button class="mx" id="mx">✕</button>
      <div id="mbody"></div>
    </div>
  </div>

  <div class="altitude-hud">
    <div class="alt-value" id="alt-Text">310m</div>
    <div class="alt-bar-track">
      <div class="alt-bar-fill" id="alt-bar"></div>
    </div>
    <div class="alt-label">COTA CASTELL → SIMARRO</div>
  </div>

  <div class="scroll-hint">
    <div class="scroll-mouse"><div class="scroll-wheel"></div></div>
    <span id="scroll-phase-label">CIMA DEL CASTILLO · HAZ SCROLL PARA BAJAR</span>
  </div>

  <main class="scroll-container"><div style="height:760vh"></div></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    const targetDate = new Date("2026-10-31T20:00:00").getTime();
    function updateCountdown() {
      const dEl = document.getElementById("cd-days");
      if (!dEl) return;
      const now = new Date().getTime();
      const diff = Math.max(0, targetDate - now);
      dEl.innerText = String(Math.floor(diff / 86400000)).padStart(2, "0");
      document.getElementById("cd-hours").innerText = String(Math.floor((diff % 86400000) / 3600000)).padStart(2, "0");
      document.getElementById("cd-mins").innerText = String(Math.floor((diff % 3600000) / 60000)).padStart(2, "0");
      document.getElementById("cd-secs").innerText = String(Math.floor((diff % 60000) / 1000)).padStart(2, "0");
    }
    setInterval(updateCountdown, 1000);

    const canvas = document.getElementById("webgl-canvas");
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x06070c, 0.0095);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 400);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0x06070c, 1);

    const ambientLight = new THREE.AmbientLight(0x3b2d54, 1.4);
    scene.add(ambientLight);

    const mainDirLight = new THREE.DirectionalLight(0xff8c3b, 2.0);
    mainDirLight.position.set(35, 75, 30);
    mainDirLight.castShadow = true;
    mainDirLight.shadow.mapSize.width = 2048;
    mainDirLight.shadow.mapSize.height = 2048;
    scene.add(mainDirLight);

    const moonMesh = new THREE.Mesh(
      new THREE.SphereGeometry(12, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xff4500 })
    );
    moonMesh.position.set(22, 48, -65);
    scene.add(moonMesh);

    function createStoneTexture(baseHex, mortarHex) {
      const c = document.createElement("canvas");
      c.width = 256; c.height = 256;
      const ctx = c.getContext("2d");
      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, 256, 256);
      ctx.strokeStyle = mortarHex;
      ctx.lineWidth = 3;
      for (let y = 0; y < 256; y += 32) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
        const offset = (y / 32) % 2 === 0 ? 0 : 32;
        for (let x = offset; x < 256; x += 64) {
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 32); ctx.stroke();
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    const castleStoneTex = createStoneTexture("#d8be94", "#9c825b");
    castleStoneTex.repeat.set(3, 3);

    function createSimarroSignTexture() {
      const c = document.createElement("canvas");
      c.width = 1024; c.height = 160;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#c9c7c3";
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.strokeStyle = "#969490";
      ctx.lineWidth = 4;
      [256, 512, 768].forEach(x => {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, c.height); ctx.stroke();
      });
      ctx.fillStyle = "#252930";
      ctx.font = "bold 54px 'Space Grotesk', sans-serif";
      ctx.fillText("IES DR. LLUÍS SIMARRO", 285, 98);
      return new THREE.CanvasTexture(c);
    }

    const castleWallMat = new THREE.MeshStandardMaterial({ map: castleStoneTex, roughness: 0.88 });
    const castleDarkStoneMat = new THREE.MeshStandardMaterial({ color: 0xb69970, roughness: 0.9 });
    const cliffRockMat = new THREE.MeshStandardMaterial({ color: 0x6e685f, roughness: 0.96, flatShading: true });
    const roofTileMat = new THREE.MeshStandardMaterial({ color: 0x7d4e38, roughness: 0.85 });
    const pineGreenMat = new THREE.MeshStandardMaterial({ color: 0x223d1e, roughness: 0.9, flatShading: true });
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x453020, roughness: 0.95 });
    const orangeNeonMat = new THREE.MeshBasicMaterial({ color: 0xff6a00 });
    const purpleNeonMat = new THREE.MeshBasicMaterial({ color: 0xa855f7 });
    const darkIronMat = new THREE.MeshStandardMaterial({ color: 0x1a1c23, roughness: 0.5, metalness: 0.6 });

    // 1. CASTELL DE XÀTIVA (Z = -22, Y = 30)
    const castleGroup = new THREE.Group();
    castleGroup.position.set(0, 30, -38);
    scene.add(castleGroup);

    const cragPositions = [
      [0, 3.5, -11, 13, 19, 8],
      [-7.5, 1.0, -9, 8.5, 14, 7],
      [7.2, 1.5, -9.5, 9, 15, 7],
      [-3.5, 6.0, -10, 7, 11, 6],
      [4.0, 5.5, -10, 7.5, 11, 6]
    ];
    cragPositions.forEach(([x, y, z, r, h, seg]) => {
      const cone = new THREE.Mesh(new THREE.ConeGeometry(r, h, seg), cliffRockMat);
      cone.position.set(x, y, z);
      cone.rotation.y = Math.random() * Math.PI;
      castleGroup.add(cone);
    });

    const summitKeep = new THREE.Mesh(new THREE.BoxGeometry(6.8, 4.6, 5.0), castleWallMat);
    summitKeep.position.set(0, 12.6, -10.5);
    summitKeep.castShadow = true;
    castleGroup.add(summitKeep);

    for (let mx = -3.0; mx <= 3.0; mx += 0.75) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.65, 0.45), castleWallMat);
      m.position.set(mx, 15.2, -8.2);
      castleGroup.add(m);
    }

    const keepWin = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 1.4), orangeNeonMat);
    keepWin.position.set(0.8, 12.6, -7.95);
    castleGroup.add(keepWin);

    const summitPine = new THREE.Group();
    summitPine.position.set(-4.5, 11.4, -10.8);
    const pTrunk = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.42, 3.2, 7), trunkMat);
    summitPine.add(pTrunk);
    [ [0, 2.0, 0, 2.2], [0.9, 2.4, 0.3, 1.6], [-0.8, 2.2, -0.2, 1.5] ].forEach(([px, py, pz, rad]) => {
      const crown = new THREE.Mesh(new THREE.SphereGeometry(rad, 8, 7), pineGreenMat);
      crown.scale.set(1.35, 0.62, 1.15);
      crown.position.set(px, py, pz);
      summitPine.add(crown);
    });
    castleGroup.add(summitPine);

    const plazaMesh = new THREE.Mesh(
      new THREE.BoxGeometry(22, 1.6, 8.9),
      new THREE.MeshStandardMaterial({ color: 0x3b3e47, roughness: 0.85 })
    );
    plazaMesh.position.set(0, -3.31, 3.45);
    plazaMesh.receiveShadow = true;
    castleGroup.add(plazaMesh);

    // 2. PASILLO / PUENTE DE CONEXIÓN ENTRE CASTILLO Y ESCALINATA
    const bridgeGroup = new THREE.Group();
    bridgeGroup.position.set(0, 27.0, -14.7);
    const bridgeMesh = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.8, 30.9), castleWallMat);
    bridgeMesh.castShadow = true;
    bridgeMesh.receiveShadow = true;
    bridgeGroup.add(bridgeMesh);
    for (let bz = -14; bz <= 14; bz += 4) {
      const wallL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 1.2, 3.2), castleDarkStoneMat);
      wallL.position.set(-2.0, 0.8, bz);
      const wallR = new THREE.Mesh(new THREE.BoxGeometry(0.35, 1.2, 3.2), castleDarkStoneMat);
      wallR.position.set(2.0, 0.8, bz);
      bridgeGroup.add(wallL, wallR);
    }
    scene.add(bridgeGroup);

    // 3. ESCALINATA EN ESPIRAL PERFECTA (HÉLICE 3D)
    const START_Y = 27.5;
    const END_Y = -42.0;
    const TOTAL_STEPS = 96;

    const curveControlPoints = [];
    const turns = 3.2;
    const spiralRadius = 6.0;
    const numPoints = 24;
    for (let i = 0; i <= numPoints; i++) {
      const t = i / numPoints;
      const y = START_Y + t * (END_Y - START_Y);
      const angle = t * turns * Math.PI * 2;
      const x = Math.sin(angle) * spiralRadius;
      const z = -9.0 + Math.cos(angle) * spiralRadius;
      curveControlPoints.push(new THREE.Vector3(x, y, z));
    }
    const stairCurve = new THREE.CatmullRomCurve3(curveControlPoints);

    const stepData = [];
    const stairsGroup = new THREE.Group();
    scene.add(stairsGroup);

    const pumpkinBodyMat = new THREE.MeshStandardMaterial({ color: 0xff5500, roughness: 0.38, emissive: 0x441200 });
    const skullBoneMat = new THREE.MeshStandardMaterial({ color: 0xe2dcd0, roughness: 0.6 });
    const gravestoneMat = new THREE.MeshStandardMaterial({ color: 0x4a4e58, roughness: 0.9 });
    const torchFlames = [];
    const floatingGhosts = [];

    function createDetailedPumpkin(scale = 1) {
      const g = new THREE.Group();
      for (let r = 0; r < 6; r++) {
        const seg = new THREE.Mesh(new THREE.SphereGeometry(0.42, 10, 10), pumpkinBodyMat);
        seg.scale.set(0.65, 0.92, 1.15);
        seg.rotation.y = (r * Math.PI) / 6;
        g.add(seg);
      }
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.1, 0.22, 6), pineGreenMat);
      stem.position.y = 0.42; stem.rotation.z = 0.2; g.add(stem);
      const eyeGeo = new THREE.ConeGeometry(0.1, 0.14, 3);
      const eyeL = new THREE.Mesh(eyeGeo, orangeNeonMat); eyeL.position.set(-0.14, 0.08, 0.42); eyeL.rotation.x = Math.PI / 2;
      const eyeR = new THREE.Mesh(eyeGeo, orangeNeonMat); eyeR.position.set(0.14, 0.08, 0.42); eyeR.rotation.x = Math.PI / 2;
      const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.09, 0.1), orangeNeonMat); mouth.position.set(0, -0.1, 0.42);
      g.add(eyeL, eyeR, mouth);
      g.scale.setScalar(scale);
      return g;
    }

    for (let i = 0; i <= TOTAL_STEPS; i++) {
      const t = i / TOTAL_STEPS;
      const pos = stairCurve.getPointAt(t);
      const tangent = stairCurve.getTangentAt(t).normalize();
      const angleY = Math.atan2(tangent.x, tangent.z);
      stepData.push({ pos, tangent, angleY });

      const stepHolder = new THREE.Group();
      stepHolder.position.copy(pos);
      stepHolder.rotation.y = angleY;

      const isNearSchool = t > 0.82;
      const treadMat = isNearSchool ? new THREE.MeshStandardMaterial({ color: 0xbdbab2, roughness: 0.6 }) : castleWallMat;
      const tread = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.28, 1.15), treadMat);
      tread.position.y = -0.14; tread.castShadow = true; tread.receiveShadow = true;
      stepHolder.add(tread);

      const riserBlock = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.95, 0.9), castleDarkStoneMat);
      riserBlock.position.set(0, -0.62, -0.1);
      stepHolder.add(riserBlock);

      if (i % 4 === 0 && i < TOTAL_STEPS - 2) {
        const postL = new THREE.Mesh(new THREE.BoxGeometry(0.34, 1.15, 0.34), castleWallMat); postL.position.set(-1.65, 0.55, 0);
        const postR = new THREE.Mesh(new THREE.BoxGeometry(0.34, 1.15, 0.34), castleWallMat); postR.position.set(1.65, 0.55, 0);
        stepHolder.add(postL, postR);

        if (i % 8 === 0) {

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = (window.__clk = window.__clk || new THREE.Clock()).getElapsedTime();
      smoothProgress += (targetScrollProgress - smoothProgress) * 0.075;
      const scrollSpeed = Math.abs(targetScrollProgress - smoothProgress);

      const BR_END = 0.2, STAIR_END = 0.8, BR_Z0 = -35.5;
      const bp = Math.min(1, smoothProgress / BR_END);
      const sp = Math.min(1, Math.max(0, (smoothProgress - BR_END) / (STAIR_END - BR_END)));
      const wp = Math.max(0, (smoothProgress - STAIR_END) / (1 - STAIR_END));
      const exactStep = sp * TOTAL_STEPS;
      const stepIdx = Math.min(TOTAL_STEPS - 1, Math.floor(exactStep));
      const fract = exactStep - stepIdx;
      const currStep = stepData[stepIdx], nextStep = stepData[stepIdx + 1];
      const BR_LEN = stepData[0].pos.z - BR_Z0;
      const charX = THREE.MathUtils.lerp(currStep.pos.x, nextStep.pos.x, fract);
      let charZ = THREE.MathUtils.lerp(currStep.pos.z, nextStep.pos.z, fract);
      const baseStepY = THREE.MathUtils.lerp(currStep.pos.y, nextStep.pos.y, fract);
      let hop = Math.sin(fract * Math.PI) * 0.34;
      let rotY = THREE.MathUtils.lerp(0, currStep.angleY, Math.min(1, sp * 25));
      if (sp <= 0) {
        charZ = THREE.MathUtils.lerp(BR_Z0, stepData[0].pos.z, bp);
        hop = Math.abs(Math.sin(bp * BR_LEN * 1.1 * Math.PI)) * 0.1; rotY = 0;
      }
      if (wp > 0) {
        charZ -= wp * WALK_LEN;
        hop = Math.abs(Math.sin(wp * WALK_LEN * 1.1 * Math.PI)) * 0.1;
        rotY = THREE.MathUtils.lerp(currStep.angleY, Math.PI, Math.min(1, wp * 8));
      }
      // Si el scroll sube, el personaje se gira y mira hacia donde camina
      const dirDiff = targetScrollProgress - smoothProgress;
      if (Math.abs(dirDiff) > 0.0015) window.__up = dirDiff < 0;
      window.__face = (window.__face || 0) + ((window.__up ? Math.PI : 0) - (window.__face || 0)) * 0.12;
      characterGroup.position.set(charX, baseStepY + hop, charZ);
      characterGroup.rotation.y = rotY + window.__face;
      const strideRaw = bp * BR_LEN * 1.1 + exactStep + wp * WALK_LEN * 1.1;
      window.__sa = (window.__sa || 0) + Math.abs(strideRaw - (window.__sr === undefined ? strideRaw : window.__sr));
      window.__sr = strideRaw;
      const strideAcc = window.__sa;

      const stridePhase = strideAcc * Math.PI;
      const strideIntensity = Math.min(1.15, 0.35 + scrollSpeed * 22);
      const leftHipAngle = Math.sin(stridePhase) * 0.65 * strideIntensity;
      const rightHipAngle = -Math.sin(stridePhase) * 0.65 * strideIntensity;
      leftLegRig.hipPivot.rotation.x = leftHipAngle;
      rightLegRig.hipPivot.rotation.x = rightHipAngle;
      leftLegRig.kneePivot.rotation.x = Math.max(0, -leftHipAngle * 1.15 + 0.25);
      rightLegRig.kneePivot.rotation.x = Math.max(0, -rightHipAngle * 1.15 + 0.25);

      leftArmRig.shoulderPivot.rotation.x = -leftHipAngle * 0.85;
      rightArmRig.shoulderPivot.rotation.x = -rightHipAngle * 0.65 - 0.35;
      capePivot.rotation.x = 0.22 + scrollSpeed * 8;

      soccerBall.position.set(0.35, 0.26 + Math.abs(Math.cos((exactStep + wp * WALK_LEN * 1.1) * Math.PI)) * 0.55, 0.78);

      torchFlames.forEach(fl => {
        fl.scale.y = 0.85 + Math.sin(elapsed * 12 + fl.userData.seed) * 0.25;
        fl.rotation.y = elapsed * 3;
      });

      const dt = Math.min(0.05, elapsed - (window.__le === undefined ? elapsed : window.__le)); window.__le = elapsed;
      walkers.forEach(w => {
        w.t += w.dir * w.speed * dt / w.len;
        if (w.t > 1) { w.t = 1; w.dir = -1; } else if (w.t < 0) { w.t = 0; w.dir = 1; }
        w.g.position.set(THREE.MathUtils.lerp(w.ax, w.bx, w.t), -0.05, THREE.MathUtils.lerp(w.az, w.bz, w.t));
        w.g.rotation.y = Math.atan2((w.bx - w.ax) * w.dir, (w.bz - w.az) * w.dir);
        w.g.userData.anim(elapsed * w.speed * 3.2 + w.seed);
      });
      floatingGhosts.forEach(g => { g.position.y = g.userData.y0 + Math.sin(elapsed * 1.6 + g.userData.s) * 0.4; g.rotation.y = Math.sin(elapsed * 0.7 + g.userData.s) * 0.5; });
      (window.__castleFlames || []).forEach(f => { f.scale.y = 0.85 + Math.sin(elapsed * 12 + f.userData.seed) * 0.25; });
      batsList.forEach(b => {
        b.userData.angle += b.userData.speed * 0.016;
        b.position.x = Math.cos(b.userData.angle) * b.userData.radius;
        b.position.z = Math.sin(b.userData.angle) * b.userData.radius - 2;
        b.position.y = b.userData.yHeight + Math.sin(elapsed * 4 + b.userData.angle) * 0.6;

    const svgBall = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff5e00" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>';
    const svgSchool = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff5e00" stroke-width="2"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2zM22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>';

    const hsList = [
      { k: "castillo", icon: svgCastle, label: "Castell de Xàtiva", p: new THREE.Vector3(0, 38, -34) },

        const q = stairCurve.getPointAt(t); return { k, icon, label, p: new THREE.Vector3(q.x, q.y + 2.6, q.z) };
      }),

      h.el.onclick = () => openModal(h.k);
      hsLayer.appendChild(h.el);
    });

    const _v = new THREE.Vector3();
    function updateHotspots(charY) {
      hsList.forEach(h => {
        _v.copy(h.p).project(camera);
        const d = Math.abs(h.p.y - charY);
        const op = _v.z > 1 ? 0 : Math.max(0, Math.min(1, 1 - (d - 12) / 8));
        h.el.style.transform = `translate(${(_v.x * 0.5 + 0.5) * innerWidth}px,${(-_v.y * 0.5 + 0.5) * innerHeight}px) translate(-50%,-50%)`;
        h.el.style.opacity = op;
        h.el.style.pointerEvents = op > 0.3 ? "auto" : "none";
      });
    }
